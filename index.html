<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2A1248">
<meta name="description" content="IELTS Mind Map Academy on TestKaro. IELTS, PTE, TOEFL, GMAT, GRE and Spoken English, with a separate timed mock test for each exam.">
<title>IELTS Mind Map Academy · TestKaro</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0;overflow-x:hidden}
:root{
  color-scheme:light;
  --bg:#f7f2ea;--surface:#fff;--sunk:#f4eef8;--ink:#241244;--muted:#5c5470;--line:rgba(36,18,68,.12);
  --accent:#4c1d78;--accent-soft:#f3e9fb;--band:#a8843a;--band-soft:#f8efd4;
  --good:#1c7a4a;--good-soft:#e5f6ee;--bad:#b42318;--bad-soft:#fde8e6;
  --gold:#c6a15a;--gold-2:#8c6820;--shadow:0 18px 40px rgba(36,18,68,.1);
  --f-display:"Outfit","Segoe UI",sans-serif;--f-serif:"Cormorant Garamond",Georgia,serif;--f-script:"Great Vibes",cursive;
  --f-body:"Manrope","Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,.84,.32,1);--r:18px;
}
*{box-sizing:border-box}
body{background:
  radial-gradient(900px 420px at 100% -10%,rgba(198,161,90,.28),transparent 55%),
  radial-gradient(720px 480px at -10% 8%,rgba(76,29,120,.14),transparent 50%),var(--bg);
  background-repeat:no-repeat;color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.03em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kicker{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2)}
.muted{color:var(--muted)}
.gold{background:linear-gradient(180deg,#f3dc8a,#b8892e);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{position:relative;overflow:hidden;display:inline-flex;white-space:nowrap;align-items:center;justify-content:center;gap:8px;border:1px solid #f6e7b8;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;background:linear-gradient(180deg,#f6e3a4,#c6a15a 46%,#8c6820);color:#241244;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 10px 20px rgba(140,104,32,.25);text-decoration:none;transition:transform .35s var(--ease),filter .35s}
.btn:not(.ghost):not(.good)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);transform:translateX(-130%);animation:sheen 4.5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,60%{transform:translateX(-130%)}80%,100%{transform:translateX(130%)}}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(36,18,68,.2);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.7)}
.btn.ghost.light{color:#fbf7f1;border-color:rgba(255,255,255,.35)}
.btn.ghost.light:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.good{background:var(--good);color:#fff;border-color:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--band-soft);color:var(--band)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.88));border:1px solid rgba(255,255,255,.8);border-radius:var(--r);box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(36,18,68,.06)}
input[type=text],input[type=email],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700}

/* page transition curtain, scroll progress */
#curtain{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:14px;pointer-events:none;color:#f0d48a;font-family:var(--f-display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;
  background:radial-gradient(70% 60% at 80% 0%,rgba(240,212,138,.35),transparent 60%),linear-gradient(160deg,#5b2390,#241244);transform:translateY(100%);visibility:hidden}
#curtain.boot,#curtain.cover,#curtain.lift{visibility:visible}
#curtain img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px rgba(240,212,138,.25),0 20px 40px rgba(0,0,0,.35);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#curtain.boot{transform:none}
#curtain.cover{transform:none;transition:transform .48s cubic-bezier(.76,0,.24,1);pointer-events:auto}
#curtain.lift{transform:translateY(-100%);transition:transform .62s cubic-bezier(.76,0,.24,1)}
#progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#6b2d91,#c6a15a)}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,#fff 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(36,18,68,.08)}
.topbar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 8px 18px rgba(36,18,68,.2);transition:transform .8s var(--ease)}
.brand:hover img{transform:rotate(-12deg) scale(1.05)}
.word b{display:block;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em;line-height:1.15}
.word small{display:block;margin-top:2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.links{display:flex;gap:16px;margin-left:8px;font-size:13px;font-weight:700}
.links a{text-decoration:none;color:var(--muted);position:relative;padding-block:4px}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.links a:hover::after,.links a[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.links a:hover,.links a[aria-current="page"]{color:var(--ink)}
.act{margin-left:auto;display:flex;gap:8px}
.menu{display:none;margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.menu span{display:block;width:16px;height:2px;background:var(--ink);border-radius:2px;transition:transform .35s var(--ease),opacity .2s}
.navopen .menu span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.navopen .menu span:nth-child(2){opacity:0}
.navopen .menu span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* bento */
.section{padding-top:44px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(30px,3.6vw,46px);margin-top:6px}
.sec-head p{color:var(--muted);max-width:46ch}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(112px,auto);gap:14px;grid-auto-flow:dense}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.r2{grid-row:span 2}.r3{grid-row:span 3}
.reveal{opacity:0;translate:0 30px;transition:opacity .9s var(--ease) calc(var(--i,0)*75ms),translate .9s var(--ease) calc(var(--i,0)*75ms)}
.reveal.in{opacity:1;translate:0 0}
.tile{--spot:rgba(198,161,90,.22);position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0;text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.72));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 16px 36px rgba(36,18,68,.08);
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));
  transition:transform .6s var(--ease),box-shadow .6s var(--ease),opacity .9s var(--ease) calc(var(--i,0)*75ms),translate .9s var(--ease) calc(var(--i,0)*75ms)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),var(--spot),transparent 62%);opacity:0;transition:opacity .45s}
.tile:hover::before{opacity:1}
a.tile:hover,.tile.lift:hover{--lift:-4px;box-shadow:inset 0 1px 0 #fff,0 26px 50px rgba(36,18,68,.16)}
.tile p{color:var(--muted);font-size:14.5px;max-width:44ch}
.t-plum,.t-ink{--spot:rgba(240,212,138,.2);color:#fbf7f1;border-color:rgba(255,255,255,.1)}
.t-plum{background:radial-gradient(120% 80% at 100% 0%,rgba(240,212,138,.42),transparent 42%),radial-gradient(80% 70% at 0% 100%,rgba(160,90,210,.42),transparent 46%),linear-gradient(155deg,#7a3aaa,#3a1468 58%,#241244);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 22px 50px rgba(36,18,72,.28)}
.t-ink{background:radial-gradient(90% 70% at 100% 100%,rgba(198,161,90,.3),transparent 55%),#1d0e38;box-shadow:0 22px 50px rgba(20,8,36,.28)}
.t-plum p,.t-ink p{color:rgba(251,247,241,.8)}
.t-plum .kicker,.t-ink .kicker{color:#f0d48a}
.t-gold{--spot:rgba(255,255,255,.4);background:linear-gradient(160deg,#f8e7b0,#d9b86c 52%,#a8843a);border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 18px 40px rgba(140,104,32,.25)}
.t-gold p{color:rgba(36,18,68,.78)}
.t-gold .kicker{color:#4c1d78}
.t-lilac{background:linear-gradient(170deg,#fff,#efe3fa)}
.t-cream{background:linear-gradient(170deg,#fffdf8,#f4e8d2)}
.tile .big{display:block;font-family:var(--f-display);font-weight:800;letter-spacing:-.045em;line-height:.95;font-size:clamp(34px,4vw,54px)}
.tile .huge{font-size:clamp(56px,8.5vw,118px);line-height:.9}
.tile .mid{font-size:clamp(30px,3.2vw,42px)}
.tile .meta{margin-top:auto;padding-right:52px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.t-plum .meta,.t-ink .meta{color:#f0d48a}
.t-gold .meta{color:#241244}
.tile .go{position:absolute;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#f6e3a4,#c6a15a);color:#241244;font-weight:800;transition:transform .6s var(--ease);box-shadow:0 8px 18px rgba(140,104,32,.25)}
.t-gold .go{background:#241244;color:#f6e3a4}
a.tile:hover .go{transform:rotate(-45deg) scale(1.08)}
.tile .bgword{position:absolute;right:-4px;bottom:-26px;z-index:-1;font-family:var(--f-display);font-weight:800;font-size:150px;letter-spacing:-.07em;line-height:1;opacity:.06;pointer-events:none;transition:transform 1.2s var(--ease)}
.tile:hover .bgword{transform:translateX(-14px)}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;transition:transform .6s var(--ease)}
.tile:hover .ico{transform:rotate(-8deg) scale(1.06)}
.t-plum .ico,.t-ink .ico{background:rgba(255,255,255,.1);color:#f0d48a}
.tname{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tile .row{margin-top:auto;padding-top:8px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(36,18,68,.12);text-decoration:none;color:inherit;transition:background .3s,transform .4s var(--ease)}
a.chip:hover{background:#fff;transform:translateY(-2px)}
.t-plum .chip,.t-ink .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.slot{background:repeating-linear-gradient(135deg,rgba(198,161,90,.08) 0 12px,transparent 12px 24px),#fffdf8;border:1.5px dashed rgba(198,161,90,.95);box-shadow:none}
.slot small{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--gold-2)}
.prose p{color:var(--ink);font-size:16px;max-width:70ch}
.prose p+p{margin-top:10px}

/* hero */
.hero{padding-top:28px}
.hero-main{padding:clamp(24px,4vw,44px);justify-content:center}
.hero-main h1{font-size:clamp(42px,6vw,82px);font-weight:800;margin-top:10px;max-width:11ch}
.est{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase;color:#f0d48a}
.est::before,.est::after{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,#f0d48a,transparent)}
.tagline{font-family:var(--f-script);font-size:clamp(28px,3.6vw,42px);line-height:1.15;color:#f6e3a4;margin-top:6px}
.hero-main .lede{margin-top:12px;font-size:17px;color:rgba(251,247,241,.82);max-width:48ch}
.emblem-tile{align-items:center;justify-content:center;padding:14px}
.emblem{position:relative;width:min(300px,100%);aspect-ratio:1;margin-inline:auto;will-change:translate}
.emblem img{width:100%;height:100%;object-fit:cover;border-radius:50%;filter:drop-shadow(0 24px 40px rgba(42,18,72,.28));position:relative;z-index:1;animation:floaty 7s ease-in-out infinite}
.ring{position:absolute;inset:5%;border-radius:50%;border:1.5px dashed rgba(198,161,90,.85);animation:spin 24s linear infinite}
.flyer{position:absolute;top:0;left:0;width:34px;height:34px;z-index:2;offset-path:ellipse(46% 46% at 50% 50%);offset-rotate:auto;animation:fly 12s linear infinite;filter:drop-shadow(0 6px 8px rgba(140,104,32,.35))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{to{offset-distance:100%}}
@keyframes floaty{50%{transform:translateY(-10px)}}
.stat .big{font-size:clamp(40px,4.6vw,60px)}
.stat span.lbl{font-weight:800;font-size:14px}

/* marquee */
.marquee{margin-top:40px;overflow:hidden;border-block:1px solid rgba(36,18,68,.1);background:rgba(255,255,255,.45);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:marq 38s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{display:flex;align-items:center;gap:28px;padding:14px 14px;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,30px);letter-spacing:-.02em;white-space:nowrap}
.track span::after{content:"✦";color:var(--gold);font-size:.7em}
.track span:nth-child(even){color:transparent;-webkit-text-stroke:1px rgba(36,18,68,.45)}
@keyframes marq{to{transform:translateX(-50%)}}

/* text split reveal */
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.split .w>*{display:inline-block;transform:translateY(108%);transition:transform 1s var(--ease) calc(var(--wi,0)*60ms + 120ms)}
.split.in .w>*{transform:none}

/* route */
.route{width:100%;height:auto;display:block}
.route .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s var(--ease) .2s}
.route .dash{stroke-dasharray:6 8;animation:dash 20s linear infinite;opacity:0;transition:opacity .6s 2.4s}
.in .route .draw,.route.in .draw{stroke-dashoffset:0}
.in .route .dash,.route.in .dash{opacity:1}
.route circle{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .7s var(--ease)}
.in .route circle,.route.in circle{transform:scale(1)}
.route circle:nth-of-type(2){transition-delay:.9s}.route circle:nth-of-type(3){transition-delay:1.6s}.route circle:nth-of-type(4){transition-delay:2.3s}
@keyframes dash{to{stroke-dashoffset:-420}}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 0;padding:0;list-style:none;counter-reset:s}
.steps3 li,.steps4 li{counter-increment:s;padding:16px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid rgba(36,18,68,.08)}
.steps3 li::before,.steps4 li::before{content:"0" counter(s);display:block;font-family:var(--f-mono);font-size:12px;color:var(--gold-2);margin-bottom:6px}
.steps3 b,.steps4 b{display:block;font-family:var(--f-display);font-size:20px}
.steps3 span,.steps4 span{color:var(--muted);font-size:14px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 0;padding:0;list-style:none;counter-reset:s}

/* packs */
.pack{gap:12px}
.pack .price{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}
.pack .price small{font-size:15px;color:var(--muted);font-weight:600;font-family:var(--f-body);letter-spacing:0}
.pack ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.pack li{display:flex;gap:8px}
.pack li::before{content:"✓";color:var(--good);font-weight:800}
.pack .btn{margin-top:auto}
.pack.pop{box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(198,161,90,.45),0 18px 40px rgba(36,18,68,.12)}
.pack .pill{position:absolute;top:16px;right:16px}

/* exam pages */
.page{padding:24px 0 48px}
.switch{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);gap:4px;margin-bottom:16px;position:relative}
.switch a{position:relative;z-index:1;padding:8px 16px;border-radius:999px;font-weight:800;font-size:13px;text-decoration:none;color:var(--muted);transition:color .3s}
.switch a.on{background:var(--ink);color:#fbf7f1}
.lede-l{font-size:18px;max-width:52ch}
.seclist{display:grid;gap:8px;margin-top:6px}
.seclist div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.seclist span{font-size:13px;color:rgba(251,247,241,.75);text-align:right}
.timebar{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px dashed rgba(255,255,255,.25)}
.timebar b{font-family:var(--f-display);font-size:28px}
.fmt{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:10px}
.fmt li{display:grid;gap:2px;padding-left:16px;position:relative}
.fmt li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:linear-gradient(180deg,#f0d48a,#8c6820)}
.fmt b{font-family:var(--f-display);font-size:16px}
.fmt span{color:var(--muted);font-size:14px}
.fine-note{margin-top:14px;font-size:12.5px;color:var(--muted)}
.credit{font-size:13px;font-weight:700;color:rgba(251,247,241,.8)}
.level h2{font-size:30px;margin:4px 0 6px}
.level ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
#programmes,#mocks,#contact,#faq,.level{scroll-margin-top:90px}

/* founder + testimonials */
.portrait{position:relative;aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:radial-gradient(80% 60% at 80% 0%,rgba(240,212,138,.35),transparent 50%),linear-gradient(180deg,#f6f1e8,#e7d7f4);border:1px dashed rgba(198,161,90,.85);box-shadow:inset 0 1px 0 #fff,0 18px 40px rgba(36,18,68,.12)}
.portrait img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.portrait-slot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.founder-layout{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:36px;align-items:start;margin-top:18px}
.founder-copy{display:grid;gap:14px;align-content:center}
.founder-copy h1{font-size:clamp(48px,6vw,80px)}
.pagehead h1{font-size:clamp(44px,6.5vw,84px);margin:8px 0 12px}
.lede{margin-top:10px;font-size:18px;color:var(--muted);max-width:50ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;transition:background .3s,color .3s}
.filters button.on{background:var(--ink);color:#fbf7f1;border-color:var(--ink)}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.quote{margin:0}
.quote q{font-family:var(--f-serif);font-size:24px;line-height:1.25;quotes:none}
.quote footer{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.shot{margin:0}
.plaque{border-radius:20px;min-height:200px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fbf7f1;background:radial-gradient(80% 60% at 80% 0%,rgba(240,212,138,.55),transparent 50%),linear-gradient(165deg,#6d2d9a,#2a1248);box-shadow:0 16px 30px rgba(36,18,68,.18)}
.plaque b{font-family:var(--f-display);font-size:48px;letter-spacing:-.04em;line-height:.9}
.shot figcaption{margin-top:8px;font-size:12px;color:var(--muted)}

/* faq + contact */
.faq{display:grid;gap:12px}
.faq details{padding:0;border-radius:18px;overflow:hidden;transition:transform .45s var(--ease),opacity .9s var(--ease) calc(var(--i,0)*75ms),translate .9s var(--ease) calc(var(--i,0)*75ms)}
.faq details:hover{transform:translateY(-2px)}
.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;font-weight:700;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:28px;height:28px;display:grid;place-items:center;font-size:22px;font-weight:500;color:var(--accent);transition:transform .45s var(--ease)}
.faq details[open] summary::after{transform:rotate(135deg)}
.faq details p{padding:0 20px 18px;color:var(--muted);font-size:15px;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.contact-card{padding:26px;display:grid;gap:14px}
.phone-row{display:grid;grid-template-columns:128px 1fr;gap:8px}
.req{color:var(--bad)}

footer.site{margin-top:40px;border-top:1px solid rgba(36,18,68,.08);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.75))}
footer.site .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;padding-block:32px 40px}
.footlinks{display:flex;flex-wrap:wrap;gap:10px 16px;align-content:start}
.footlinks a{font-weight:700;font-size:14px;text-decoration:none}
.footlinks a:hover{color:var(--accent)}
.script{font-family:var(--f-script);font-size:28px;line-height:1;margin-top:8px}
.fine{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800}
.logo img{width:36px;height:36px;border-radius:50%;object-fit:cover}
#app.enter{animation:enter .5s ease}
@keyframes enter{from{opacity:.01}to{opacity:1}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,8,36,.55);z-index:60;display:grid;place-items:center;padding:16px;animation:fadeIn .3s ease}
.modal{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .body{padding:20px;display:grid;gap:16px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.stepper{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.stepper span{flex:1;padding-top:6px;border-top:3px solid var(--line)}
.stepper span.on{border-color:var(--gold);color:var(--ink);font-weight:700}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--sunk);border-radius:12px;padding:16px}
.qrbox canvas{width:148px;height:148px;background:#fff;border-radius:8px;padding:8px}
.upi{font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);padding:6px 9px;border-radius:6px;display:inline-block}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0}
.check{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;animation:pop .6s var(--ease)}

/* student / admin desk */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:rgba(255,255,255,.8);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.side nav{display:grid;gap:2px}
.side nav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.side nav button:hover{background:var(--sunk);color:var(--ink)}
.side nav button.on{background:var(--accent-soft);color:var(--accent)}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:13px;padding:10px;border-radius:12px;background:var(--sunk)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.main{padding:26px 22px 40px;min-width:0}
.main h1{font-size:28px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-c{padding:16px}
.stat-c span{font-size:13px;color:var(--muted)}
.stat-c b{display:block;font-family:var(--f-display);font-size:28px;margin-top:4px}
.stat-c small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.panel{padding:18px;min-width:0}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tlist{display:grid;gap:10px}
.trow{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.55)}
.trow .badge{width:56px;height:46px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;flex:none;color:var(--accent)}
.trow .info{flex:1;min-width:0}
.trow .info b{display:block;font-size:14px}
.trow .info span{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.emailprev{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.emailprev .eh{background:var(--sunk);padding:10px 12px;display:grid;gap:2px}
.emailprev .eb{padding:14px 12px;display:grid;gap:8px}
.packedit{display:grid;gap:10px}
.packedit .pr{display:grid;grid-template-columns:1fr 90px 100px;gap:8px;align-items:center}
.packedit .pr.four{grid-template-columns:1fr 120px 1fr}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.drop img,.drop canvas{width:86px;height:86px;border-radius:8px;background:#fff;object-fit:contain;padding:4px}
.packrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.packrow .card{padding:20px;display:grid;gap:10px}

/* test room */
.troom{min-height:100vh;display:flex;flex-direction:column}
.tbar{background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.tbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-weight:600;font-size:20px;padding:4px 12px;border-radius:10px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad);animation:pulse 1s ease-in-out infinite}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--ink);color:#fbf7f1;border-color:var(--ink)}
.tbody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.tbody.swap{animation:fadeIn .45s ease}
.tbody.single{grid-template-columns:minmax(0,820px);justify-content:center}
.tbody>div{padding:24px;min-width:0}
.passage{border-right:1px solid var(--line);background:rgba(255,255,255,.72)}
.passage h2{font-size:22px;margin:6px 0 14px}
.passage p{max-width:62ch;margin-bottom:12px}
.posts{display:grid;gap:10px;margin-top:14px}
.post{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14.5px}
.post b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.post.prof{background:var(--accent-soft);border-color:transparent}
.ctx{padding:12px 14px;border-radius:12px;background:var(--band-soft);font-size:14px;margin-bottom:10px}
table.di{width:auto;min-width:min(420px,100%);background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
table.di td,table.di th{padding:10px 14px;font-family:var(--f-mono);font-size:13px}
table.di td:first-child{font-family:var(--f-body);font-weight:700}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.q .qn{font-family:var(--f-mono);color:var(--accent);flex:none}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;background:#fff;transition:background .25s,border-color .25s}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.palette span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:#fff}
.palette span.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.wc{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
textarea.essay{min-height:340px;line-height:1.65;resize:vertical}
.evaluating{display:grid;place-items:center;gap:14px;padding:80px 16px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin .9s linear infinite}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:24px}
.ring-score{width:160px;height:160px}
.ring-score .arc{stroke-dasharray:0 999;animation:arc 1.6s var(--ease) .2s forwards}
@keyframes arc{to{stroke-dasharray:var(--len) 999}}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.sec{background:var(--sunk);border-radius:12px;padding:10px}
.sec span{display:block;font-size:12px;color:var(--muted)}
.sec b{font-family:var(--f-mono);font-size:18px}
.meter{height:6px;background:rgba(36,18,68,.1);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#6b2d91,#c6a15a);border-radius:4px;transform-origin:0 50%;animation:grow 1.4s var(--ease) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
.fb{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;font-size:13px;display:grid;gap:8px}
.fb div{display:flex;gap:8px}
.fb .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.review{display:grid;gap:8px}
.review h4{font-size:13px;margin-top:6px;color:var(--muted);letter-spacing:.02em}
.review div{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;background:#241244;color:#fbf7f1;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:pop .4s var(--ease)}

/* dock, library, join bar */
.dock{position:fixed;right:16px;bottom:108px;z-index:45;display:grid;gap:10px;justify-items:end}
.dock button,.dock a.chipb{display:flex;align-items:center;gap:8px;border:0;background:#fff;color:var(--accent);border-radius:16px;padding:10px 12px;font-weight:800;font-size:13px;box-shadow:0 10px 28px rgba(36,18,68,.16);text-decoration:none;transition:transform .4s var(--ease)}
.dock button:hover,.dock a.chipb:hover{transform:translateY(-3px) scale(1.03)}
.dock .up{width:46px;height:46px;border-radius:50%;padding:0;justify-content:center;background:#241244;color:#f6e3a4;font-size:18px}
.lib{position:fixed;inset:0;z-index:70;background:rgba(20,8,36,.45);display:grid;justify-items:end;align-items:end;padding:16px 16px 120px}
.lib-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);animation:pop .45s var(--ease)}
.lib-card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lib-card h5{margin:12px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-family:var(--f-display)}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib-grid a{text-decoration:none;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,#fff,#f6efff);border:1px solid rgba(36,18,68,.08);font-weight:800;font-size:14px}
.joinbar{position:fixed;left:0;right:0;bottom:0;z-index:44;display:flex;align-items:center;gap:16px;padding:14px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:linear-gradient(90deg,#2a1248,#4c1d78 55%,#3a1860);color:#fbf7f1;box-shadow:0 -12px 30px rgba(36,18,68,.2);animation:barIn .8s var(--ease) 1s both}
@keyframes barIn{from{transform:translateY(100%)}to{transform:none}}
.joinbar b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:-.03em}
.joinbar span{font-size:13px;opacity:.85}
.joinbar .wa{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;flex:none;margin-left:auto}
.joinbar .x{background:transparent;color:#fff;border:0;font-size:22px}
body.desk{padding-bottom:0}
body.desk .dock,body.desk .joinbar,body.no-join .joinbar{display:none}
body.no-join{padding-bottom:0}
body.desk .toast,body.no-join .toast{bottom:calc(20px + env(safe-area-inset-bottom))}

@media (max-width:980px){
  .bento{grid-template-columns:repeat(6,minmax(0,1fr))}
  .c2,.c3,.c4{grid-column:span 3}
  .c5,.c6,.c7,.c8,.c12{grid-column:span 6}
  .r3{grid-row:span 2}
  .steps4{grid-template-columns:1fr 1fr}
  .grid2,.founder-layout{grid-template-columns:1fr}
  .quotes{grid-template-columns:1fr 1fr}
  .shots,.stats,.packrow{grid-template-columns:1fr 1fr}
  .links,.act .btn.ghost{display:none}
  .menu{display:flex}
  .topbar.navopen .links{display:flex;flex-direction:column;position:absolute;top:calc(100% + 8px);left:12px;right:12px;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);z-index:30;animation:pop .35s var(--ease)}
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side nav{display:flex;overflow-x:auto;gap:4px}
  .side nav button{white-space:nowrap}
  .side .who,.side .logo{display:none}
  .main{padding:20px 16px 32px}
  .tbody{grid-template-columns:1fr}
  .passage{border-right:0;border-bottom:1px solid var(--line)}
  .res-top{grid-template-columns:1fr;justify-items:center;text-align:center}
  footer.site .wrap{grid-template-columns:1fr}
  .dock{right:10px;bottom:96px}
}
@media (max-width:640px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;grid-auto-rows:minmax(96px,auto)}
  .c2,.c3,.c4{grid-column:span 1}
  .c5,.c6,.c7,.c8,.c12,.m-full{grid-column:span 2}
  .r2,.r3{grid-row:auto}
  .tile{padding:18px;border-radius:22px}
  .tile .bgword{font-size:110px}
  .tile p{font-size:14px}
  .hero-main{min-height:420px}
  .emblem{width:min(220px,100%)}
  .steps3,.steps4,.quotes,.shots,.stats,.packrow{grid-template-columns:1fr}
  .qrbox{grid-template-columns:1fr;justify-items:center;text-align:center}
  .packedit .pr,.packedit .pr.four{grid-template-columns:1fr 70px 80px}
  .word b{font-size:11px}
  .brand img{width:44px;height:44px}
  .topbar .wrap{gap:10px}
  .act .btn{padding:8px 12px;font-size:12.5px}
  .dock button,.dock a.chipb{width:46px;height:46px;padding:0;border-radius:50%;font-size:0;gap:0;justify-content:center}
  .joinbar b{font-size:18px}
  .joinbar span{display:none}
  .seclist div{flex-direction:column;gap:2px}
  .seclist span{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;translate:none}
  .split .w>*{transform:none}
  .route .draw{stroke-dashoffset:0}.route .dash{opacity:1}.route circle{transform:none}
  #curtain{display:none}
}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<div id="curtain" class="boot" aria-hidden="true"><img src="/images/logo.jpg" alt=""><span>IELTS Mind Map Academy</span></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<aside class="dock" aria-label="Shortcuts">
  <button type="button" data-library aria-label="Library"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 4h9l3 3v13H6z"/><path d="M15 4v4h4M8 12h8M8 16h6"/></svg>Library</button>
  <a class="chipb" href="/#contact" data-nav aria-label="Contact us"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v5h3v-5M17 12v5h3v-5"/><path d="M9 18h6"/></svg>Contact us</a>
  <button class="up" type="button" data-top aria-label="Back to top">↑</button>
</aside>
<div id="library" class="lib" hidden>
  <div class="lib-card" role="dialog" aria-label="Library">
    <header><b>Library</b><button class="x" type="button" data-lib-close aria-label="Close">×</button></header>
    <h5>Programmes</h5>
    <div class="lib-grid">
      <a href="/ielts" data-nav>IELTS</a><a href="/pte" data-nav>PTE</a><a href="/toefl" data-nav>TOEFL</a>
      <a href="/gmat" data-nav>GMAT</a><a href="/gre" data-nav>GRE</a><a href="/spoken-english" data-nav>Spoken English</a>
    </div>

}

/* ---------- buying ---------- */
function drawQR(cv){
  const n=25,ctx=cv.getContext("2d"),sz=cv.width/n;ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.width);ctx.fillStyle="#241244";
  let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(r()>.52)ctx.fillRect(x*sz,y*sz,sz,sz)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{ctx.fillStyle="#fff";ctx.fillRect((x-1)*sz,(y-1)*sz,9*sz,9*sz);ctx.fillStyle="#241244";ctx.fillRect(x*sz,y*sz,7*sz,7*sz);ctx.fillStyle="#fff";ctx.fillRect((x+1)*sz,(y+1)*sz,5*sz,5*sz);ctx.fillStyle="#241244";ctx.fillRect((x+2)*sz,(y+2)*sz,3*sz,3*sz)});
}

/* ---------- student desk ---------- */
function chart(){
  const a=S.attempts.filter(x=>x.exam==="ielts").slice(-6);
  if(a.length<2) return `<p class="muted" style="font-size:14px">Sit two IELTS mocks to see a trend.</p>`;
  const W=520,H=190,pl=34,pr=14,pt=14,pb=30,min=4,max=8;
  const x=i=>pl+i*(W-pl-pr)/(a.length-1),y=b=>pt+(max-b)/(max-min)*(H-pt-pb);
  const pts=a.map((d,i)=>[x(i),y(d.score)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts.at(-1)[0]} ${H-pb} L${pts[0][0]} ${H-pb} Z`;
  let g="";for(let b=min;b<=max;b++){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(b)}" y2="${y(b)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(b)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${b}.0</text>`}
  const tgt=`<line x1="${pl}" x2="${W-pr}" y1="${y(7)}" y2="${y(7)}" stroke="var(--band)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-pr}" y="${y(7)-6}" text-anchor="end" font-size="11" fill="var(--band)" font-weight="600">Target 7.0</text>`;
  const labels=a.map((d,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.date}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"var(--accent)":"#fff"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="IELTS band over the last ${a.length} attempts">${g}${tgt}<path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

function mcqStat(T,si){const s=T.mock.sections[si];const c=s.questions.filter((q,qi)=>T.ans[si+":"+qi]===q.a).length;return {c,n:s.questions.length,p:c/s.questions.length}}

  pte(T){const r=mcqStat(T,0),w=essayStat(T,1);const rs=Math.round(10+80*r.p),ws=w.w?Math.round(10+80*w.f):10,o=Math.round((rs+ws)/2);
    return {score:o,label:`${o} / 90`,head:{text:String(o),sub:"overall, on the 10–90 scale",frac:(o-10)/80},

  toefl(T){const r=mcqStat(T,0),w=essayStat(T,1);const rb=half(1+5*r.p),wb=w.w?half(1+5*w.f):1,o=half((rb+wb)/2);

let io=null;
function splitWords(el){

  [...el.childNodes].forEach(n=>{
    if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(part=>{if(!part)return;if(/^\s+$/.test(part)){frag.append(" ");return}const w=document.createElement("span");w.className="w";const s=document.createElement("span");s.textContent=part;s.style.setProperty("--wi",i++);w.append(s);frag.append(w)})}
    else{const w=document.createElement("span");w.className="w";n.style?.setProperty("--wi",i++);w.append(n);frag.append(w)}
  });

function countUp(el){
  const to=+el.dataset.count,from=+(el.dataset.from||0),dur=1500,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  el.textContent=from;requestAnimationFrame(step);
}
function enhance(){
  const root=$("#app");
  root.querySelectorAll(".tile,.sec-head,.faq details,.pagehead,.filters,.shot,.route").forEach(el=>el.classList.add("reveal"));
  root.querySelectorAll(".bento,.faq,.quotes,.shots").forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty("--i",i%6)));
  root.querySelectorAll("[data-split]").forEach(splitWords);
  const targets=root.querySelectorAll(".reveal,.split,[data-count]");
  if(RM.matches||!("IntersectionObserver" in window)){targets.forEach(el=>el.classList.add("in"));return}
  io?.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;el.classList.add("in");if(el.dataset.count&&!el.dataset.counted){el.dataset.counted="1";countUp(el)}io.unobserve(el)}),{threshold:.12,rootMargin:"0px 0px -5% 0px"});
  targets.forEach(el=>io.observe(el));
}
let hot=null;
document.addEventListener("pointermove",e=>{
  const t=e.target.closest?.(".tile");
  if(hot&&hot!==t){hot.style.removeProperty("--rx");hot.style.removeProperty("--ry");hot=null}
  if(!t||e.pointerType!=="mouse"||RM.matches)return;
  const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  t.style.setProperty("--mx",(x*100).toFixed(1)+"%");t.style.setProperty("--my",(y*100).toFixed(1)+"%");
  if(t.matches("a.tile,.lift")){const k=Math.min(1,320/r.width);t.style.setProperty("--rx",((.5-y)*5*k).toFixed(2)+"deg");t.style.setProperty("--ry",((x-.5)*7*k).toFixed(2)+"deg")}
  hot=t;
},{passive:true});

addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;const h=document.documentElement,p=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);$("#progress").style.setProperty("--p",p.toFixed(4));const em=$("#emblem");if(em&&!RM.matches)em.style.translate=`0 ${Math.min(60,h.scrollTop*.12).toFixed(1)}px`})},{passive:true});

  if(el)setTimeout(()=>el.scrollIntoView({behavior:RM.matches?"auto":"smooth",block:"start"}),40);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="library"){e.target.hidden=true;return}
  const t=e.target.closest("a[data-nav],[data-menu],[data-filter],[data-go],[data-buy],[data-buylink],[data-buystep],[data-close],[data-scrim],[data-sub],[data-start],[data-startexam],[data-tab],[data-submit],[data-model],[data-grant],[data-reject],[data-savepacks],[data-library],[data-lib-close],[data-top],[data-join-close]");
  if(!t)return;
  if(t.matches("a[data-nav]")){
    const url=new URL(t.getAttribute("href"),location.href);
    if(url.origin!==location.origin)return;
    e.preventDefault();
    $("#library").hidden=true;
    document.querySelector(".topbar.navopen")?.classList.remove("navopen");
    const target=route(url.pathname),same=target.view===S.view&&target.exam===S.exam;
    if(same){history.pushState({},"",url.pathname+url.hash);if(url.hash)focusHash();else window.scrollTo({top:0,behavior:RM.matches?"auto":"smooth"});return}
    curtain(()=>{
      history.pushState({},"",url.pathname+url.hash);
      if(timerInt){clearInterval(timerInt);timerInt=null}
      applyRoute();render();
      if(url.hash)focusHash();else window.scrollTo(0,0);
    });
    return;
  }
  if(t.hasAttribute("data-menu")){const bar=t.closest(".topbar");bar.classList.toggle("navopen");t.setAttribute("aria-expanded",bar.classList.contains("navopen"));return}
  if(t.hasAttribute("data-library")){$("#library").hidden=false;return}
  if(t.hasAttribute("data-lib-close")){$("#library").hidden=true;return}
  if(t.hasAttribute("data-top")){window.scrollTo({top:0,behavior:RM.matches?"auto":"smooth"});return}
  if(t.hasAttribute("data-join-close")){document.body.classList.add("no-join");return}
  if(t.dataset.filter){
    const root=t.closest(".stories");
    root.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("on",b===t));
    root.querySelectorAll("[data-story]").forEach(el=>{el.hidden=t.dataset.filter!=="all"&&el.dataset.story!==t.dataset.filter});
    return;
  }
  if(t.hasAttribute("data-scrim")&&e.target!==t)return;
  if(t.dataset.close!==undefined||t.hasAttribute("data-scrim")){$("#modal").innerHTML=""}
  if(t.dataset.go){const v=t.dataset.go==="site"?"home":t.dataset.go;go(v,v==="admin"?"pay":v==="student"?"dash":undefined);return}
  if(t.dataset.buy){openBuy(t.dataset.buy);return}
  if(t.dataset.buylink){e.preventDefault();openBuy(t.dataset.buylink);return}
  if(t.dataset.buystep){const[id,s]=t.dataset.buystep.split(":");openBuy(id,+s);return}
  if(t.dataset.sub){S.sub=t.dataset.sub.split(":")[1];render();return}
  if(t.dataset.start){startTest(+t.dataset.start);return}
  if(t.dataset.startexam){startExam(t.dataset.startexam);return}
  if(t.dataset.tab){const ta=$("#essay");if(ta)S.test.essay[S.test.tab]=ta.value;S.test.tab=+t.dataset.tab;S.test.swap=true;render();window.scrollTo(0,0);return}
  if(t.hasAttribute("data-model")){S.test.essay[S.test.tab]=S.test.mock.sections[S.test.tab].sample||"";render();return}
  if(t.hasAttribute("data-submit")){submitTest();return}
  if(t.dataset.grant){const i=S.pending.findIndex(p=>p.id==t.dataset.grant),p=S.pending[i];S.pending.splice(i,1);
    S.granted.unshift({...p,at:"Just now"});const P=pk(p.pack);S.lastEmail={to:p.email,price:P.price,tests:P.tests,utr:p.utr};
    if(p.email===ME.email)S.credits+=P.tests;render();toast(`Access granted. Email sent to ${esc(p.email)}`);return}
  if(t.dataset.reject){const i=S.pending.findIndex(p=>p.id==t.dataset.reject),p=S.pending[i];S.pending.splice(i,1);render();toast(`Payment from ${esc(p.email)} rejected`);return}
  if(t.hasAttribute("data-savepacks")){document.querySelectorAll("[data-pf]").forEach(inp=>{const[id,f]=inp.dataset.pf.split(":");const p=pk(id);p[f]=f==="name"?inp.value:Math.max(1,+inp.value||1)});toast("Prices saved. The website now shows the new prices.");return}
});
document.addEventListener("change",e=>{
  const a=e.target.dataset.ans;if(a){const[si,qi,oi]=a.split(":").map(Number);S.test.ans[si+":"+qi]=oi;render();return}
  if(e.target.id==="qrfile"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{S.qrImg=r.result;render();toast("QR updated. Students now see this code at checkout.")};r.readAsDataURL(e.target.files[0])}
});
document.addEventListener("input",e=>{if(e.target.id==="essay"){S.test.essay[S.test.tab]=e.target.value;const w=$("#wc");if(w)w.textContent=words(e.target.value)+" words"}});
document.addEventListener("submit",e=>{
  const id=e.target.id;if(!["payform","addtest","contactform"].includes(id))return;e.preventDefault();
  if(id==="contactform"){
    const role=$("#c-role").value,name=$("#c-name").value.trim(),email=$("#c-email").value.trim(),phone=$("#c-code").value+" "+$("#c-phone").value.trim(),msg=$("#c-msg").value.trim();
    if(!role||!name||!/^\S+@\S+\.\S+$/.test(email)||!$("#c-phone").value.trim()||!msg){toast("Fill every field so the academy can reply");return}
    S.messages.unshift({role,name,email,phone,msg});e.target.reset();toast("Received. The academy will reply within 24 hours.");return;
  }
  if(id==="addtest"){
    const name=$("#nt-name").value.trim(),exam=$("#nt-exam").value,meta=$("#nt-meta").value.trim();
    if(!name||!meta){toast("Add a name and the sections");return}
    TESTS.push({exam,code:EXAMS[exam].name,name,meta});render();toast(`${esc(name)} is live on the student desk`);return;
  }
  const email=$("#pay-email").value.trim(),utr=$("#pay-utr").value.trim(),pack=e.target.dataset.pack;
  if(!/^\S+@\S+\.\S+$/.test(email)){toast("Enter a valid email so we can send your access");return}
  if(!/^\d{12}$/.test(utr)){toast("UTR should be the 12-digit number from your UPI app");return}
  S.pending.unshift({id:S.nextId++,email,pack,utr,at:"Just now"});openBuy(pack,3);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#modal").innerHTML="";$("#library").hidden=true}});
addEventListener("popstate",()=>{if(timerInt){clearInterval(timerInt);timerInt=null}applyRoute();render();focusHash()});

applyRoute();render();focusHash();
const lift=()=>{const c=$("#curtain");if(!c.classList.contains("boot"))return;c.classList.replace("boot","lift");setTimeout(()=>c.classList.remove("lift"),700)};
if(RM.matches)$("#curtain").classList.remove("boot");else{addEventListener("load",()=>setTimeout(lift,250));setTimeout(lift,2500)}
</script>
</body>
</html>
