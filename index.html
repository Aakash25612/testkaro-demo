<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2A1248">
<meta name="description" content="IELTS Mind Map Academy on TestKaro. IELTS, PTE, TOEFL, GMAT, GRE and Spoken English, plus timed mock tests.">
<title>IELTS Mind Map Academy · TestKaro</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0;overflow-x:hidden}
:root{
  color-scheme:light;
  --bg:#f7f2ea;
  --surface:#ffffff;
  --sunk:#f4eef8;
  --ink:#241244;
  --muted:#5c5470;
  --line:rgba(36,18,68,.12);
  --accent:#4c1d78;
  --accent-ink:#fffaf2;
  --accent-soft:#f3e9fb;
  --band:#a8843a;
  --band-soft:#f8efd4;
  --good:#1c7a4a;
  --good-soft:#e5f6ee;
  --bad:#b42318;
  --bad-soft:#fde8e6;
  --gold:#c6a15a;
  --gold-2:#8c6820;
  --violet:#6b2d91;
  --shadow:0 18px 40px rgba(36,18,68,.1);
  --f-display:"Outfit","Segoe UI",sans-serif;
  --f-serif:"Cormorant Garamond",Georgia,serif;
  --f-script:"Great Vibes",cursive;
  --f-body:"Manrope","Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:18px;
  --demo-h:48px;
}
*{box-sizing:border-box}
body{background:
  radial-gradient(900px 420px at 100% -10%, rgba(198,161,90,.28), transparent 55%),
  radial-gradient(720px 480px at -10% 8%, rgba(76,29,120,.14), transparent 50%),
  var(--bg);
  color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.03em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kicker,.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2)}
.muted{color:var(--muted)}
.gold{background:linear-gradient(180deg,#f3dc8a,#b8892e);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #f6e7b8;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;background:linear-gradient(180deg,#f6e3a4,#c6a15a 46%,#8c6820);color:#241244;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 10px 20px rgba(140,104,32,.25);text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(36,18,68,.2);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.7)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.good{background:var(--good);color:#fff;border-color:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--band-soft);color:var(--band)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.88));border:1px solid rgba(255,255,255,.8);border-radius:var(--r);box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(36,18,68,.06)}
input[type=text],input[type=email],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700}

.demobar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#2a1248,#4c1d78 55%,#2a1248);color:#fbf7f1}
.demobar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.demobar .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#f0d48a}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:inherit;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;opacity:.8}
.seg button.on{background:linear-gradient(180deg,#f6e3a4,#c6a15a);color:#241244;opacity:1}
.demobar .note{margin-left:auto;font-size:12px;opacity:.72}

.topbar{position:sticky;top:var(--demo-h);z-index:40;background:color-mix(in srgb,#fff 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(36,18,68,.08)}
.topbar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 8px 18px rgba(36,18,68,.2)}
.word b{display:block;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em;line-height:1.15}
.word small{display:block;margin-top:2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.links{display:flex;gap:14px;margin-left:8px;font-size:13px;font-weight:700}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover,.links a[aria-current="page"]{color:var(--ink)}
.act{margin-left:auto;display:flex;gap:8px}
.menu{display:none;margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.menu span{display:block;width:16px;height:2px;background:var(--ink);border-radius:2px}

.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding-top:48px;padding-bottom:12px}
.est{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase;color:var(--accent)}
.est::before,.est::after{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero-copy h1{font-size:clamp(40px,5.6vw,72px);font-weight:800;margin-top:14px}
.tagline{font-family:var(--f-script);font-size:clamp(30px,4vw,44px);line-height:1.15;color:#2a1248;margin-top:8px;font-weight:400}
.lede{margin-top:14px;font-size:18px;color:var(--muted);max-width:46ch}
.hero-copy .ctas{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.emblem{position:relative;width:min(440px,100%);aspect-ratio:1;margin-inline:auto}
.emblem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(42,18,72,.28));position:relative;z-index:1}
.ring{position:absolute;inset:7%;border-radius:50%;border:1.5px dashed rgba(198,161,90,.85);animation:spin 28s linear infinite}
.flyer{position:absolute;top:0;left:0;width:36px;height:36px;z-index:2;offset-path:ellipse(40% 40% at 50% 50%);offset-rotate:auto;animation:fly 14s linear infinite;filter:drop-shadow(0 6px 8px rgba(140,104,32,.35))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{to{offset-distance:100%}}

.bento-wrap{padding-top:28px;padding-bottom:10px}
.bento-wrap .intro{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:16px;flex-wrap:wrap}
.bento-wrap h2{font-size:clamp(28px,3vw,40px)}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(150px,auto);gap:14px}
.bcard{position:relative;overflow:hidden;border-radius:24px;padding:20px;min-height:168px;text-decoration:none;color:var(--ink);background:
  linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.62)),#fff;
  border:1px solid rgba(255,255,255,.85);
  box-shadow:inset 0 1px 0 #fff,0 16px 36px rgba(36,18,68,.08);
  display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}
.bcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.55) 48%,transparent 64%);transform:translateX(-130%);transition:transform .7s;pointer-events:none}
.bcard:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 #fff,0 22px 44px rgba(36,18,68,.14)}
.bcard:hover::after{transform:translateX(130%)}
.bcard .code{font-size:clamp(28px,3vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1}
.bcard p{color:var(--muted);font-size:14.5px;max-width:36ch}
.bcard .meta{margin-top:auto;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.bcard .go{position:absolute;right:16px;bottom:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#f6e3a4,#c6a15a);color:#241244;font-weight:800;z-index:1}
.bcard.ielts{grid-column:span 4;grid-row:span 2;min-height:340px;color:#fbf7f1;background:
  radial-gradient(120% 80% at 100% 0%,rgba(240,212,138,.5),transparent 42%),
  radial-gradient(80% 70% at 0% 100%,rgba(160,90,210,.45),transparent 46%),
  linear-gradient(155deg,#7a3aaa,#3a1468 58%,#241244);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 22px 50px rgba(36,18,72,.28)}
.bcard.ielts::before{content:"";position:absolute;width:210px;height:210px;border:1.5px solid rgba(240,212,138,.5);border-left-color:transparent;border-radius:50%;right:-48px;top:-60px;transform:rotate(18deg)}
.bcard.ielts p{color:rgba(251,247,241,.82)}
.bcard.ielts .kicker,.bcard.ielts .meta{color:#f0d48a}
.bcard.ielts .code{font-size:clamp(48px,6vw,84px)}
.bcard.pte,.bcard.toefl,.bcard.gmat,.bcard.gre,.bcard.spoken{grid-column:span 2}
.bcard.spoken{padding:0}
.bmain{display:flex;flex-direction:column;gap:8px;padding:20px 20px 8px;text-decoration:none;color:inherit;flex:1;position:relative;z-index:1}
.lvls{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px;position:relative;z-index:2}
.lvls a{text-decoration:none;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(36,18,68,.12)}
.lvls a:hover{border-color:var(--gold);background:#fff}

.method{padding-top:34px;padding-bottom:10px}
.method h2{font-size:clamp(32px,4vw,52px);margin:8px 0 18px}
.route{width:min(640px,100%);height:70px;display:block;margin-bottom:8px}
.route path{stroke-dasharray:6 8;animation:dash 16s linear infinite}
@keyframes dash{to{stroke-dashoffset:-420}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;list-style:none;margin:0;padding:0}
.steps li{padding:22px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 12px 28px rgba(36,18,68,.06)}
.steps b{display:block;font-family:var(--f-display);font-size:22px;margin-bottom:6px}
.steps span{color:var(--muted);font-size:14.5px}
.steps a{color:var(--accent);font-weight:700}

.block{padding-top:36px;padding-bottom:36px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.4vw,40px);margin-top:6px}
.sh p{color:var(--muted);max-width:46ch}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pack{padding:24px;display:flex;flex-direction:column;gap:14px;position:relative}
.pack.pop{border-color:rgba(198,161,90,.8);box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(198,161,90,.25),0 18px 40px rgba(36,18,68,.1)}
.pack .pill{position:absolute;top:16px;right:16px}
.pack .price{font-family:var(--f-display);font-weight:800;font-size:42px;letter-spacing:-.03em}
.pack .price small{font-size:15px;color:var(--muted);font-weight:600;font-family:var(--f-body)}
.pack ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.pack li{display:flex;gap:8px}
.pack li::before{content:"✓";color:var(--good);font-weight:800}
.pack .btn{margin-top:auto}
.faq{display:grid;gap:10px;max-width:780px}
.faq details{padding:14px 18px}
.faq summary{font-weight:700;cursor:pointer}
.faq details p{margin-top:8px;color:var(--muted);font-size:14px}

.page{padding:28px 0 48px}
.back{display:inline-flex;margin-bottom:16px;font-size:13px;font-weight:700;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.pagehead h1{font-size:clamp(46px,7vw,88px);margin:8px 0 12px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.fact{padding:16px;border-radius:18px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.7));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(36,18,68,.06)}
.fact b{display:block;font-family:var(--f-display);font-size:16px}
.fact span{display:block;margin-top:4px;color:var(--muted);font-size:13.5px}
.split{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:22px;align-items:start}
.ticks{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.ticks li{padding-left:18px;position:relative}
.ticks li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:linear-gradient(180deg,#f0d48a,#8c6820)}
.gloss{padding:22px;border-radius:22px;background:
  radial-gradient(120% 80% at 100% 0%,rgba(240,212,138,.45),transparent 46%),
  linear-gradient(160deg,#fff,#f6efff);
  border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 16px 36px rgba(36,18,68,.08);display:grid;gap:12px}
.levels{margin-top:28px}
.levels h2{font-size:clamp(28px,3vw,40px);margin-bottom:14px}
.levelgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#programmes,#mocks,.level{scroll-margin-top:calc(var(--demo-h) + 88px)}
.level{padding:22px;border-radius:22px;background:#fff;border:1px solid rgba(36,18,68,.08);box-shadow:0 14px 30px rgba(36,18,68,.06)}
.level h2{font-size:28px;margin:6px 0 8px}
.level ul{margin:10px 0 0;padding-left:18px;color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.filters button.on{background:var(--ink);color:#fbf7f1;border-color:var(--ink)}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.quote{padding:22px;border-radius:22px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.78));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 14px 30px rgba(36,18,68,.07);display:flex;flex-direction:column;gap:14px}
.quote q{font-family:var(--f-serif);font-size:24px;line-height:1.25;quotes:none}
.quote footer{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.shot{margin:0}
.plaque{position:relative;overflow:hidden;border-radius:20px;min-height:210px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fbf7f1;background:
  radial-gradient(80% 60% at 80% 0%,rgba(240,212,138,.55),transparent 50%),
  linear-gradient(165deg,#6d2d9a,#2a1248);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 16px 30px rgba(36,18,68,.18)}
.plaque b{font-family:var(--f-display);font-size:48px;letter-spacing:-.04em;line-height:.9}
.ribbon{position:absolute;top:14px;right:-28px;transform:rotate(28deg);background:linear-gradient(180deg,#f6e3a4,#c6a15a);color:#241244;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 36px}
.shot figcaption{margin-top:8px;font-size:12px;color:var(--muted)}
.sample-note{font-size:14px;color:var(--muted);max-width:62ch}

footer.site{margin-top:20px;border-top:1px solid rgba(36,18,68,.08);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.75))}
footer.site .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;padding-block:32px 40px}
.footlinks{display:flex;flex-wrap:wrap;gap:10px 16px;align-content:start}
.footlinks a{font-weight:700;font-size:14px;text-decoration:none}
.script{font-family:var(--f-script);font-size:28px;line-height:1;margin-top:8px}
.fine{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800}
.logo img{width:36px;height:36px;border-radius:50%;object-fit:cover}

.rise{opacity:0;transform:translateY(16px);animation:rise .7s ease forwards}
.rise:nth-child(2){animation-delay:.05s}
@keyframes rise{to{opacity:1;transform:none}}
#app.enter{animation:enter .45s ease}
@keyframes enter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:none}}

.scrim{position:fixed;inset:0;background:rgba(20,8,36,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .body{padding:20px;display:grid;gap:16px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.stepper{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.stepper span{flex:1;padding-top:6px;border-top:3px solid var(--line)}
.stepper span.on{border-color:var(--gold);color:var(--ink);font-weight:700}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--sunk);border-radius:12px;padding:16px}
.qrbox canvas{width:148px;height:148px;background:#fff;border-radius:8px;padding:8px}
.upi{font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);padding:6px 9px;border-radius:6px;display:inline-block}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0}
.check{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 46px)}
.side{background:rgba(255,255,255,.8);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.side nav{display:grid;gap:2px}
.side nav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.side nav button:hover{background:var(--sunk);color:var(--ink)}
.side nav button.on{background:var(--accent-soft);color:var(--accent)}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:13px;padding:10px;border-radius:12px;background:var(--sunk)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.main{padding:26px 22px 40px;min-width:0}
.main h1{font-size:28px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.tile{padding:16px}

.trow .info{flex:1;min-width:0}

.trow .info span{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.emailprev{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.emailprev .eh{background:var(--sunk);padding:10px 12px;display:grid;gap:2px}
.emailprev .eb{padding:14px 12px;display:grid;gap:8px}
.packedit{display:grid;gap:10px}
.packedit .pr{display:grid;grid-template-columns:1fr 90px 100px;gap:8px;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.drop img,.drop canvas{width:86px;height:86px;border-radius:8px;background:#fff;object-fit:contain;padding:4px}

.troom{min-height:calc(100vh - 46px);display:flex;flex-direction:column}
.tbar{background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.tbar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-weight:600;font-size:20px;padding:4px 12px;border-radius:10px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--ink);color:#fbf7f1;border-color:var(--ink)}
.tbody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.tbody>div{padding:24px;min-width:0}
.passage{border-right:1px solid var(--line);background:rgba(255,255,255,.72)}
.passage h2{font-size:22px;margin:6px 0 14px}
.passage p{max-width:62ch;margin-bottom:12px}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.q .qn{font-family:var(--f-mono);color:var(--accent);flex:none}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;background:#fff}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.palette span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:#fff}
.palette span.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.wc{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
textarea.essay{min-height:340px;line-height:1.65;resize:vertical}
.evaluating{display:grid;place-items:center;gap:14px;padding:80px 16px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:24px}
.ring-score{width:150px;height:150px}
.sec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.sec{background:var(--sunk);border-radius:12px;padding:10px}
.sec span{display:block;font-size:12px;color:var(--muted)}
.sec b{font-family:var(--f-mono);font-size:18px}
.meter{height:6px;background:rgba(36,18,68,.1);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#6b2d91,#c6a15a);border-radius:4px}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:13px;display:grid;gap:8px}
.fb div{display:flex;gap:8px}
.fb .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.crit{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.review{display:grid;gap:8px}
.review div{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;background:#241244;color:#fbf7f1;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:980px){
  .hero-grid,.split,.grid2{grid-template-columns:1fr}

  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side nav{display:flex;overflow-x:auto;gap:4px}
  .side nav button{white-space:nowrap}
  .side .who,.side .logo{display:none}
  .main{padding:20px 16px 32px}
  .tbody{grid-template-columns:1fr}
  .passage{border-right:0;border-bottom:1px solid var(--line)}
  .crit{grid-template-columns:1fr 1fr}
  .res-top{grid-template-columns:1fr}
  .demobar .note{display:none}
  footer.site .wrap{grid-template-columns:1fr}
}
@media (max-width:640px){
  .bento,.facts,.levelgrid,.quotes,.shots,.tiles,.packs,.steps,.sec-grid{grid-template-columns:1fr}

}

function drawQR(cv){
  const n=25,ctx=cv.getContext("2d"),sz=cv.width/n;ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.width);ctx.fillStyle="#241244";
  let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(r()>.52)ctx.fillRect(x*sz,y*sz,sz,sz)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{ctx.fillStyle="#fff";ctx.fillRect((x-1)*sz,(y-1)*sz,9*sz,9*sz);ctx.fillStyle="#241244";ctx.fillRect(x*sz,y*sz,7*sz,7*sz);ctx.fillStyle="#fff";ctx.fillRect((x+1)*sz,(y+1)*sz,5*sz,5*sz);ctx.fillStyle="#241244";ctx.fillRect((x+2)*sz,(y+2)*sz,3*sz,3*sz)});
}

    <div class="head" style="margin:0"><div><span class="kicker">Practice result</span><h1 style="font-size:28px;margin-top:6px">${TESTS[T.i].name}</h1></div><div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-go="student">Back to dashboard</button></div></div>
    <div class="card res-top">${ring(R.overall)}<div style="display:grid;gap:14px;min-width:0"><div><b style="font-size:18px">Estimated overall ${R.overall.toFixed(1)}</b><p class="muted" style="font-size:14px">Demo scoring for practice. It is not an official band or test-centre result.</p></div>
      <div class="sec-grid" style="grid-template-columns:repeat(2,minmax(0,220px));margin:0"><div class="sec"><span>Reading · ${R.correct}/5 correct</span><b>${R.rb.toFixed(1)}</b><div class="meter"><i style="width:${R.rb/9*100}%"></i></div></div><div class="sec"><span>Writing · ${R.w} words</span><b>${R.wband.toFixed(1)}</b><div class="meter"><i style="width:${R.wband/9*100}%"></i></div></div></div></div></div>
    <div class="grid2">
      <div class="card panel"><h3>Writing notes <span class="pill acc">Estimate</span></h3>
        <div class="crit">${R.crit.map(c=>`<div class="sec"><span>${c[0]}</span><b class="mono">${c[1].toFixed(1)}</b></div>`).join("")}</div>
        <div class="fb" style="margin-top:14px">${fb.map(f=>`<div><span class="dot" style="background:var(--${f[0]==="warn"?"band":f[0]})"></span><span>${f[1]}</span></div>`).join("")}</div>
      </div>
      <div class="card panel"><h3>Reading answers</h3><div class="review">${QS.map((q,i)=>{const ok=T.ans[i]===q.a;return `<div><span class="pill ${ok?"good":"bad"}">${ok?"✓":"✗"} Q${i+1}</span><span style="min-width:0;white-space:normal">${q.o[q.a]}${!ok&&T.ans[i]!=null?` <span class="muted">(you chose: ${q.o[T.ans[i]]})</span>`:""}${T.ans[i]==null?' <span class="muted">(not answered)</span>':""}</span></div>`}).join("")}</div></div>
    </div></div>`;
}

function admin(){
  const rev=S.granted.reduce((s,g)=>s+pk(g.pack).price,0)+2340;
  let content="";
  if(S.sub==="dash"||S.sub==="pay"){
    content=`<div class="head"><div><h1>Payments</h1><p class="muted" style="font-size:14px">Check each UTR, then grant access. The student gets an email in this demo.</p></div><span class="pill">Sample data</span></div>
    <div class="tiles">
      <div class="card tile"><span>Waiting for approval</span><b style="color:${S.pending.length?"var(--band)":"var(--good)"}">${S.pending.length}</b><small>${S.pending.length?"Needs a check":"All clear"}</small></div>
      <div class="card tile"><span>Active students</span><b>${148+S.granted.length}</b><small>With credits left</small></div>
      <div class="card tile"><span>Tests taken this month</span><b>612</b><small>Practice marked</small></div>
      <div class="card tile"><span>Revenue this month</span><b>${inr(rev)}</b><small>Via UPI</small></div>
    </div>
    <div style="display:grid;gap:18px">
        <div class="card panel"><h3>Waiting for approval <span class="pill warn">${S.pending.length}</span></h3>
          ${S.pending.length?`<div class="tablewrap"><table><thead><tr><th>Student email</th><th>Pack</th><th>Amount</th><th>UTR</th><th>Submitted</th><th></th></tr></thead><tbody>
          ${S.pending.map(p=>`<tr><td>${p.email}${p.email===ME.email?' <span class="pill acc">new</span>':""}</td><td>${pk(p.pack).tests} test${pk(p.pack).tests>1?"s":""}</td><td class="mono">${inr(pk(p.pack).price)}</td><td class="mono">${p.utr}</td><td class="muted">${p.at}</td><td><div class="acts"><button class="btn good sm" type="button" data-grant="${p.id}">Grant access</button><button class="btn ghost sm" type="button" data-reject="${p.id}">Reject</button></div></td></tr>`).join("")}
          </tbody></table></div>`:`<p class="muted">No payments waiting.</p>`}
        </div>
      <div class="grid2">
        <div class="card panel"><h3>Access granted</h3><div class="tablewrap"><table><thead><tr><th>Student email</th><th>Pack</th><th>Amount</th><th>Status</th></tr></thead><tbody>
          ${S.granted.map(g=>`<tr><td>${g.email}</td><td>${pk(g.pack).tests} test${pk(g.pack).tests>1?"s":""}</td><td class="mono">${inr(pk(g.pack).price)}</td><td><span class="pill good">Email sent</span></td></tr>`).join("")}
        </tbody></table></div></div>
      <div class="card panel"><h3>Last email sent</h3>
        ${S.lastEmail?`<div class="emailprev"><div class="eh"><span><b>To:</b> ${S.lastEmail.to}</span><span><b>Subject:</b> Your TestKaro mock tests are unlocked</span></div><div class="eb"><b>Hi there,</b><p>We've received your payment of ${inr(S.lastEmail.price)}. ${S.lastEmail.tests} mock test${S.lastEmail.tests>1?"s have":" has"} been added to your account.</p><p>Log in and start your first test whenever you're ready.</p><span class="btn sm" style="justify-self:start">Start my test</span><span class="muted" style="font-size:12px">IELTS Mind Map Academy · TestKaro · UTR ${S.lastEmail.utr}</span></div></div>`:`<p class="muted" style="font-size:14px">Grant access to a payment to see the email the student receives.</p>`}
      </div>
      </div>
    </div>`;
  }
  if(S.sub==="packs") content=`<div class="head"><div><h1>Test packs &amp; QR</h1><p class="muted" style="font-size:14px">Changes show on the website straight away.</p></div></div>
    <div class="grid2"><div class="card panel"><h3>Packs and prices</h3><div class="packedit"><div class="pr muted" style="font-size:12px;font-weight:700"><span>Pack name</span><span>Tests</span><span>Price (₹)</span></div>
      ${S.packs.map(p=>`<div class="pr"><input type="text" id="pn-${p.id}" value="${p.name}" data-pf="${p.id}:name"><input type="number" id="pt-${p.id}" min="1" value="${p.tests}" data-pf="${p.id}:tests"><input type="number" id="pp-${p.id}" min="1" value="${p.price}" data-pf="${p.id}:price"></div>`).join("")}
      <div><button class="btn sm" type="button" data-savepacks>Save prices</button></div></div></div>
      <div class="card panel"><h3>Payment QR code</h3><div class="drop">${S.qrImg?`<img src="${S.qrImg}" alt="Uploaded QR">`:`<canvas id="qr" width="200" height="200"></canvas>`}<div style="display:grid;gap:8px"><b style="font-size:14px">Your UPI QR</b><span class="muted" style="font-size:13px">Upload the QR from your UPI app. Students see it at checkout.</span><label class="btn ghost sm" style="justify-self:start">Upload QR image<input type="file" id="qrfile" accept="image/*" hidden></label></div></div></div></div>`;
  if(S.sub==="tests") content=`<div class="head"><h1>Mock tests</h1><button class="btn sm" type="button" data-toast="The test editor opens in the full build">Add mock test</button></div>
    <div class="card panel"><div class="tablewrap"><table><thead><tr><th>Test</th><th>Sections</th><th>Attempts</th><th>Avg band</th><th>Status</th></tr></thead><tbody>
    ${TESTS.map((t,i)=>`<tr><td><b>${t.name}</b></td><td class="muted">${t.meta}</td><td class="mono">${[214,131,168,99][i]}</td><td class="mono">${[6.0,6.5,5.5,6.0][i].toFixed(1)}</td><td><span class="pill good">Live</span></td></tr>`).join("")}
    </tbody></table></div></div>`;
  if(S.sub==="students") content=`<div class="head"><h1>Students</h1></div><div class="card panel"><div class="tablewrap"><table><thead><tr><th>Email</th><th>Credits left</th><th>Tests taken</th><th>Latest band</th></tr></thead><tbody>
    <tr><td>${ME.email}</td><td class="mono">${S.credits}</td><td class="mono">${S.attempts.length}</td><td class="mono">${S.attempts.at(-1).band.toFixed(1)}</td></tr>
    ${S.granted.map((g,i)=>`<tr><td>${g.email}</td><td class="mono">${pk(g.pack).tests-[3,1,0,2][i%4]}</td><td class="mono">${[3,1,0,2][i%4]}</td><td class="mono">${["6.5","5.5","–","7.0"][i%4]}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  return `<div class="shell">${sideNav([["pay","Payments"],["packs","Packs & QR"],["tests","Mock tests"],["students","Students"]],S.sub==="dash"?"pay":S.sub,"admin")}<main class="main">${content}</main></div>`;
}

function render(){
  const a=$("#app");
  const v=S.view;
  const titles={home:"IELTS Mind Map Academy",stories:"Testimonials",student:"Student desk",admin:"Admin",test:"Mock test"};
  const label=SERVICES[v]?.name||titles[v]||"IELTS Mind Map Academy";
  document.title=v==="home"?"IELTS Mind Map Academy · TestKaro":`${label} · IELTS Mind Map Academy`;
  const seg=v==="admin"?"admin":(v==="student"||v==="test")?"student":"site";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.go===seg));
  const marketing=v==="home"||v==="stories"||!!SERVICES[v];
  a.className=marketing?"enter":"";
  a.innerHTML=v==="student"?student():v==="test"?testRoom():v==="admin"?admin():v==="stories"?stories():SERVICES[v]?servicePage(SERVICES[v]):home();
  const cv=a.querySelector("#qr");if(cv)drawQR(cv);
  const bar=$(".demobar");if(bar)document.documentElement.style.setProperty("--demo-h",bar.offsetHeight+"px");
}
function focusHash(){
  if(!location.hash)return;
  const el=document.querySelector(location.hash);
  if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),30);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("a[data-nav],[data-menu],[data-filter],[data-go],[data-buy],[data-buylink],[data-buystep],[data-close],[data-scrim],[data-scroll],[data-sub],[data-start],[data-tab],[data-submit],[data-sample],[data-grant],[data-reject],[data-savepacks],[data-toast]");
  if(!t)return;
  if(t.matches("a[data-nav]")){
    const url=new URL(t.getAttribute("href"),location.origin);
    if(url.origin!==location.origin)return;
    e.preventDefault();
    history.pushState({},"",url.pathname+url.hash);
    if(timerInt){clearInterval(timerInt);timerInt=null}
    S.view=viewFromLocation();
    if(S.view==="student")S.sub="dash";
    if(S.view==="admin")S.sub="pay";
    render();
    if(url.hash)focusHash();else window.scrollTo(0,0);
    return;
  }
  if(t.hasAttribute("data-menu")){const bar=t.closest(".topbar");bar.classList.toggle("navopen");t.setAttribute("aria-expanded",bar.classList.contains("navopen"));return}
  if(t.dataset.filter){
    const root=t.closest(".stories");
    root.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("on",b===t));
    root.querySelectorAll("[data-story]").forEach(el=>{el.hidden=t.dataset.filter!=="all"&&el.dataset.story!==t.dataset.filter});
    return;
  }
  if(t.hasAttribute("data-scrim")&&e.target!==t)return;
  if(t.dataset.close!==undefined||t.hasAttribute("data-scrim")){$("#modal").innerHTML=""}
  if(t.dataset.go){const raw=t.dataset.go;const v=raw==="site"?"home":raw;go(v,v==="admin"?"pay":v==="student"?"dash":undefined);return}
  if(t.dataset.buy){openBuy(t.dataset.buy);return}
  if(t.dataset.buylink){e.preventDefault();openBuy(t.dataset.buylink);return}
  if(t.dataset.buystep){const[id,s]=t.dataset.buystep.split(":");openBuy(id,+s);return}
  if(t.dataset.scroll){document.getElementById(t.dataset.scroll)?.scrollIntoView({behavior:"smooth"});return}
  if(t.dataset.sub){const[,k]=t.dataset.sub.split(":");S.sub=k;render();return}
  if(t.dataset.start){startTest(+t.dataset.start);return}
  if(t.dataset.tab){const ta=$("#essay");if(ta)S.test.essay=ta.value;S.test.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.hasAttribute("data-sample")){S.test.essay=SAMPLE;render();return}
  if(t.hasAttribute("data-submit")){submitTest();return}
  if(t.dataset.grant){const i=S.pending.findIndex(p=>p.id==t.dataset.grant),p=S.pending[i];S.pending.splice(i,1);
    S.granted.unshift({...p,at:"Just now"});const P=pk(p.pack);S.lastEmail={to:p.email,price:P.price,tests:P.tests,utr:p.utr};
    if(p.email===ME.email)S.credits+=P.tests;render();toast(`Access granted. Email sent to ${p.email}`);return}
  if(t.dataset.reject){const i=S.pending.findIndex(p=>p.id==t.dataset.reject),p=S.pending[i];S.pending.splice(i,1);render();toast(`Payment from ${p.email} rejected`);return}
  if(t.hasAttribute("data-savepacks")){document.querySelectorAll("[data-pf]").forEach(inp=>{const[id,f]=inp.dataset.pf.split(":");const p=pk(id);p[f]=f==="name"?inp.value:Math.max(1,+inp.value||1)});toast("Prices saved. The website now shows the new prices.");return}
  if(t.dataset.toast){toast(t.dataset.toast);return}
});
document.addEventListener("change",e=>{
  const a=e.target.dataset.ans;if(a){const[q,o]=a.split(":").map(Number);S.test.ans[q]=o;render();return}
  if(e.target.id==="qrfile"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{S.qrImg=r.result;render();toast("QR updated. Students now see this code at checkout.")};r.readAsDataURL(e.target.files[0])}
});
document.addEventListener("input",e=>{if(e.target.id==="essay"){S.test.essay=e.target.value;const w=$("#wc");if(w)w.textContent=words(e.target.value)+" words"}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="payform")return;e.preventDefault();
  const email=$("#pay-email").value.trim(),utr=$("#pay-utr").value.trim(),id=e.target.dataset.pack;
  if(!/^\S+@\S+\.\S+$/.test(email)){toast("Enter a valid email so we can send your access");return}
  if(!/^\d{12}$/.test(utr)){toast("UTR should be the 12-digit number from your UPI app");return}
  S.pending.unshift({id:S.nextId++,email,pack:id,utr,at:"Just now"});openBuy(id,3);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").innerHTML=""});
window.addEventListener("popstate",()=>{
  if(timerInt){clearInterval(timerInt);timerInt=null}
  S.view=viewFromLocation();
  if(S.view==="admin")S.sub="pay";
  if(S.view==="student")S.sub="dash";
  render();
  focusHash();
});
S.view=viewFromLocation();
if(S.view==="admin")S.sub="pay";
if(S.view==="student")S.sub="dash";
render();
focusHash();
</script>
</body>
</html>
